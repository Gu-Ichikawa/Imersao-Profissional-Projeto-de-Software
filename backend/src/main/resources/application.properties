spring.application.name=zentry-backend

# Banco de dados (o banco "zentry" é criado automaticamente)
# Usuário e senha vêm das variáveis de ambiente DB_USER e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zentry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# As tabelas são criadas pelo Flyway (db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Endereço do frontend liberado no CORS
zentry.cors.origens-permitidas=http://localhost:5173

# Listagens paginadas: no máximo 50 itens por página
spring.data.web.pageable.max-page-size=50
